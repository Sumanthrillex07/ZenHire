spring:
  application:
    name: zenhire-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Database & Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zenhire_db}
    username: ${DB_USER:zenhire_user}
    password: ${DB_PASSWORD:zenhire_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # Spring Data JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false # Best Practice: Disables OSIV to avoid open DB connections during JSON rendering
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  # Flyway Database Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # File Upload Limits
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

# Server Port & Context
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

# File Storage Configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

# Google Gemini LLM API Configuration
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

